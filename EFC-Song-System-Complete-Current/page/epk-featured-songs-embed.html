<!--
Electric Flower Co.
EPK Featured Songs Widget
Version 2.0
-->

<style>
#efc-epk-featured-songs {
    width:100%;
    max-width:900px;
    margin:0 auto;
    box-sizing:border-box;
}

.efc-featured-song-list {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:32px;
    row-gap:16px;
}

.efc-featured-song {
    text-align:center;
}

.efc-featured-title {
    font-weight:600;
    font-size:1.05em;
    line-height:1.3;
}

.efc-featured-artist {
    margin-top:3px;
    opacity:.62;
    font-size:.88em;
    line-height:1.35;
}

.efc-featured-empty,
.efc-featured-count {
    text-align:center;
    opacity:.62;
}

@media(max-width:700px) {
    #efc-epk-featured-songs {
        max-width:100%;
        padding:0 14px;
    }

    .efc-featured-song-list {
        grid-template-columns:1fr;
        row-gap:14px;
    }
}
</style>

<div id="efc-epk-featured-songs">
    <p style="text-align:center;padding:18px;">
        Loading featured songs...
    </p>
</div>

<script>
window.addEventListener("load", function () {

    const container =
        document.getElementById(
            "efc-epk-featured-songs"
        );

    if (typeof EFC === "undefined") {

        if (container) {
            container.innerHTML =
                "<p style='text-align:center;'>EFC library not loaded.</p>";
        }

        return;
    }

    if (
        typeof EFC.renderFeaturedSongs !==
        "function"
    ) {

        if (container) {
            container.innerHTML =
                "<p style='text-align:center;'>Song widgets not loaded.</p>";
        }

        return;
    }

    EFC.renderFeaturedSongs(
        "efc-epk-featured-songs",
        {
            showArtists:true,
            showCount:false
        }
    );

});
</script>
